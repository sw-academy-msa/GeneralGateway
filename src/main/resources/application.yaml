# 공통 설정에는 운영 주소와 비밀값을 포함하지 않습니다.
spring:
  application:
    name: gateway
  profiles:
    default: local
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          httpclient:
            # 같은 VPC 안의 연결은 1초 안에 맺어지므로, 죽은 인스턴스를 빨리 포기하고 조회 재시도로 넘깁니다.
            connect-timeout: 1000
            # 응답 시간 초과는 서버가 이미 처리 중일 수 있어 재시도하지 않습니다.
            response-timeout: 10s
          # 외부 Forwarded 값을 재사용하지 않습니다. ALB 신뢰 정책은 배포 문서를 따릅니다.
          forwarded:
            enabled: false
          x-forwarded:
            enabled: false
    # 게이트웨이도 Eureka 목록만 믿지 않고 서비스 인스턴스 상태를 주기적으로 확인해 죽은 인스턴스를 라우팅 대상에서 미리 뺍니다.
    # LoadBalancer 자체 재시도는 끄고, 조회(GET, HEAD)만 라우트 Retry 필터로 다른 인스턴스에 1회 재시도합니다(SafeReadRetryConfig).
    loadbalancer:
      # Eureka와 health supplier의 캐시 위에 별도 캐시를 중첩하지 않습니다.
      cache:
        enabled: false
      configurations: health-check
      health-check:
        # 메일·DB 같은 외부 연결 검사가 들어간 /actuator/health 대신 인스턴스 기동 여부만 보는 readiness를 씁니다.
        # 전체 health를 주기적으로 호출하면 Account의 메일 검사가 SMTP에 반복 로그인해 차단되고 인스턴스가 통째로 제외됩니다.
        path:
          default: /actuator/health/readiness
        interval: 5s
        refetch-instances: true
        refetch-instances-interval: 5s
      retry:
        enabled: false
server:
  port: ${SERVER_PORT:8000}
  shutdown: graceful
  forward-headers-strategy: none
gateway:
  auth:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:stockdrop-api}
    jwk-set-uri: ${ACCOUNT_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
eureka:
  client:
    # 서버에서 제거된 인스턴스를 5초 주기로 반영합니다.
    registry-fetch-interval-seconds: 5
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    # heartbeat 10초, 임대 30초입니다. Eureka 서버는 마지막 갱신 시각에 임대 기간을 두 번 더해 만료를 판단하므로
    # heartbeat가 끊긴 인스턴스는 약 60초 뒤 제거됩니다(기존 기본값은 약 180초).
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    hostname: ${SERVICE_HOSTNAME:localhost}
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${SERVICE_INSTANCE_ID:${random.uuid}}
    non-secure-port: ${SERVICE_PORT:${server.port}}
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/health
management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# 업무 JWT와 분리된 읽기 전용 수집 토큰입니다. 빈 값이면 메트릭 접근을 거부합니다.
monitoring:
  scrape-token: ${MONITORING_SCRAPE_TOKEN:}
